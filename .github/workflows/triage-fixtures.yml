name: Triage Fixtures

# Runs the deliberately-failing fixtures in yaml-examples/triage-fixtures/ so
# the CI Failure Triage pipeline has something to diagnose on a regular cadence.
#
# This workflow is EXPECTED TO BE RED. That is the point. It is kept separate
# from "YAML Examples Tests" so the main suite stays a real signal: if these
# fixtures lived there, main would be permanently red and a genuine regression
# would look identical to them.
#
# Deliberately not triggered on push or pull_request — a permanently-failing
# workflow on every commit is noise, and each red run spends an agent run in
# triage. Nightly plus on-demand is enough to prove the pipeline works.
#
# Path-scoped to the fixtures themselves. Deliberately NOT triggered by changes
# to playwright.config.ts or package.json: this suite is red by design, so
# firing it on shared-config edits would turn unrelated PRs red.
on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC daily
  pull_request:
    branches: [main]
    paths:
      - 'yaml-examples/triage-fixtures/**'
      - '.github/workflows/triage-fixtures.yml'
  workflow_dispatch: {}

concurrency:
  group: triage-fixtures
  cancel-in-progress: true

jobs:
  fixtures:
    name: Deliberately-failing triage fixtures
    runs-on: shiplight-small
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        working-directory: yaml-examples
        run: npm ci

      # No `continue-on-error` — see the note in yaml-examples.yml. It would
      # hide the test output from `gh run view --log-failed`, which is exactly
      # the evidence the triage agent reads.
      - name: Run triage fixtures
        id: tests
        working-directory: yaml-examples
        run: npx shiplight test --project triage-fixtures --workers=2

      # Note: no `npx shiplight report` here. These tests fail by design, and
      # publishing them to Shiplight Cloud would drag down the pass-rate and
      # flaky-test analytics the `cloud` subcommand reports. Triage reads the
      # GitHub artifact below, not the cloud, so it loses nothing.

      - name: Upload test report (for triage)
        if: ${{ !cancelled() }}
        uses: ShiplightAI/ci-triage/upload-report@v1.2
        with:
          name: triage-fixtures-report
          report-dir: yaml-examples/shiplight-report
