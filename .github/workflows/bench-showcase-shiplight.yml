name: Bench - showcase on Shiplight runner

# Runner comparison study, arm B: self-hosted shiplight-small (e2-standard-4,
# 4 vCPU / 16 GB, GCP us-central1-a).
#
# Paired with bench-showcase-gha.yml (arm A, ubuntu-latest). Read the header
# there first — it explains why the two files must stay step-for-step aligned
# and why arm A carries two extra steps.
#
# Deliberately NOT set here:
#   SHIPLIGHT_API_TOKEN — the runner agent injects a per-run shp_ctx_* token.
#   Overriding it with the arm-A PAT would replace a per-run scoped credential
#   with a long-lived one for no gain: resolveApiBase only tests the bare `shp_`
#   prefix, so both token types already take an identical code path.
#   SHIPLIGHT_REPORT_TO_CLOUD — injected as '1' by the runner agent.

on:
  push:
    branches: [bench/runner-comparison]
  workflow_dispatch: {}

# No `concurrency` group — see bench-showcase-gha.yml.

jobs:
  bench:
    name: showcase / shiplight-small / workers=2
    runs-on: shiplight-small
    timeout-minutes: 30

    env:
      PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/yaml-examples/pw-results.json

    steps:
      - name: Machine profile
        run: |
          echo "== cpu =="
          nproc
          grep -m1 'model name' /proc/cpuinfo
          echo "== memory =="
          free -h
          echo "== disk =="
          df -h /
          echo "== disk write throughput =="
          dd if=/dev/zero of=/tmp/bench.bin bs=1M count=1024 conv=fdatasync 2>&1 | tail -1
          rm -f /tmp/bench.bin
          echo "== toolchain =="
          node --version
          npm --version
          cat /etc/os-release | head -2

      - name: Network probe
        run: |
          probe() {
            echo "-- $1"
            for i in 1 2 3; do
              curl -s -o /dev/null \
                -w "  dns=%{time_namelookup}s tcp=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s http=%{http_code}\n" \
                "$1" || echo "  probe failed"
            done
          }
          probe https://registry.npmjs.org/shiplightai
          probe https://nova-api.shiplight.ai/health
          probe https://static.shiplight.ai/testing/index.html
          probe https://www.wikipedia.org

      - name: Checkout
        uses: actions/checkout@v6

      # No setup-node step — the image ships Node 24.15.0 / npm 11.12.1, which
      # is what arm A pins itself to. The Machine profile step above reprints
      # the version every run so the pairing stays verifiable rather than
      # assumed; it already caught the Dockerfile's stale "Node 22" comment.

      - name: Install dependencies
        working-directory: yaml-examples
        run: npm ci

      # No "Install Chromium" step — mcr.microsoft.com/playwright:v1.60.0-jammy
      # carries the browser binaries. This absence is arm B's headline saving
      # and arm A prices it explicitly.

      - name: Run showcase tests
        id: tests
        working-directory: yaml-examples
        run: npx shiplight test --project showcase --workers=2

      - name: Upload results to Shiplight
        if: always() && steps.tests.outcome != 'skipped'
        working-directory: yaml-examples
        run: npx shiplight report
        continue-on-error: true

      - name: Upload timing artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bench-shiplight-timings
          path: |
            yaml-examples/shiplight-report/**/report-data.json
            yaml-examples/pw-results.json
          if-no-files-found: warn
