name: YAML Examples Tests

on:
  push:
    branches: [main]
    paths:
      - 'yaml-examples/**'
  pull_request:
    branches: [main]
    paths:
      - 'yaml-examples/**'
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E demo + showcase tests
    runs-on: shiplight-small
    # 42 AI-driven browser tests (24 demo + 18 showcase) at 2 workers, each
    # allowed 10 min by playwright.config.ts. The old 30 minutes was sized for
    # the demo project alone.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        working-directory: yaml-examples
        # `npm ci` matches what the triage autofix job runs, so lockfile drift
        # surfaces here first instead of only breaking the autofix re-run.
        run: npm ci

      - name: Run demo and showcase tests
        id: tests
        continue-on-error: true
        working-directory: yaml-examples
        # `setup` runs automatically as a dependency of `demo`. The generated
        # *.yaml.spec.ts files are gitignored; `shiplight test` transpiles the
        # .test.yaml sources on the fly.
        run: npx shiplight test --project demo --project showcase --workers=2

      - name: Upload results to Shiplight
        if: always() && steps.tests.outcome != 'skipped'
        working-directory: yaml-examples
        run: npx shiplight report

      # Failure evidence for the CI Failure Triage workflow. Drops the traces
      # (*.zip) and videos (*.webm) the agent never reads; humans still get the
      # full set from the Shiplight cloud report uploaded above.
      - name: Upload test report (for triage)
        if: ${{ !cancelled() }}
        uses: ShiplightAI/ci-triage/upload-report@v1.2
        with:
          report-dir: yaml-examples/shiplight-report

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
